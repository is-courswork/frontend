name: airlines-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:?required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
    networks:
      web:
        aliases: [frontend]

networks:
  web:
    external: true
    name: airlines_web
