name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an active main deployment finish before the next main workflow starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Record frontend revision
        env:
          COMMIT: ${{ github.sha }}
        run: node -e 'require("fs").writeFileSync("dist/frontend-version.json", JSON.stringify({commit:process.env.COMMIT}))'
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  image:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: deploy/image/dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested build
        id: image
        uses: docker/build-push-action@v7
        with:
          context: deploy/image
          push: true
          tags: ghcr.io/is-courswork/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/is-courswork/frontend
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test the published image
        env:
          IMAGE: ghcr.io/is-courswork/frontend@${{ steps.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          docker run -d --name frontend-smoke --network none --read-only \
            --tmpfs /tmp:size=32m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges "$IMAGE"
          ready=false
          for attempt in $(seq 1 20); do
            if docker exec frontend-smoke wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          for path in / /runs /runs/3fa85f64-5717-4562-b3fc-2c963f66afa6; do
            docker exec frontend-smoke wget -q -O /dev/null "http://127.0.0.1:8080$path"
          done
          docker exec frontend-smoke wget -q -O - http://127.0.0.1:8080/frontend-version.json > image-version.json
          python3 - "$COMMIT" <<'PY'
          import json, sys
          with open('image-version.json') as f:
              assert json.load(f)['commit'] == sys.argv[1]
          PY
      - name: Remove smoke test container
        if: ${{ always() }}
        run: docker rm -f frontend-smoke 2>/dev/null || true

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://airlines.arhr.tech
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH'
          Host *
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
            KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
          SSH
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.1.3
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer published image over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          FRONTEND_IMAGE: ghcr.io/is-courswork/frontend@${{ needs.image.outputs.digest }}
        run: |
          docker pull "$FRONTEND_IMAGE"
          image_id=$(docker image inspect --format '{{.Id}}' "$FRONTEND_IMAGE")
          [[ "$image_id" == "${FRONTEND_IMAGE##*@}" ]]
          docker image save "$FRONTEND_IMAGE" | gzip -1 | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            env DOCKER_HOST=unix:///run/airlines-docker/docker.sock docker image load
      - name: Deploy published image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          FRONTEND_IMAGE: ghcr.io/is-courswork/frontend@${{ needs.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          tar -czf release.tar.gz -C deploy compose.yaml
          scp -o BatchMode=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/airlines/incoming/frontend-$COMMIT.tar.gz"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$FRONTEND_IMAGE" "$COMMIT" < deploy/deploy.sh
      - name: Verify public frontend and API
        env:
          COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 10 --retry-all-errors \
            https://airlines.arhr.tech/frontend-version.json > deployed-version.json
          python3 - "$COMMIT" <<'PY'
          import json, sys
          with open('deployed-version.json') as f:
              assert json.load(f)['commit'] == sys.argv[1]
          PY
          for path in / /runs /api/core/run/all; do
            curl --fail --silent --show-error --max-time 20 "https://airlines.arhr.tech$path" > /dev/null
          done
      - name: Remove temporary SSH credentials
        if: ${{ always() }}
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
